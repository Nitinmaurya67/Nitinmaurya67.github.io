<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio — Under Development</title>
<link rel="author" href="mailto:nitin101ji@gmail.com" />
<style>
  :root{
    --bg1:#0f1724;
    --bg2:#071029;
    --accent:#7ee7c1;
    --muted:#9aa6b2;
    --glass: rgba(255,255,255,0.04);
    --radius:16px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 10% 10%, rgba(126,231,193,0.06), transparent 8%),
                radial-gradient(900px 500px at 90% 90%, rgba(124,58,237,0.05), transparent 8%),
                linear-gradient(180deg,var(--bg1),var(--bg2));
    color:#e6eef6;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:grid;
    place-items:center;
    padding:32px;
  }

  .card{
    max-width:920px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    border-radius:var(--radius);
    box-shadow: 0 8px 30px rgba(2,6,23,0.6);
    padding:32px;
    border: 1px solid rgba(255,255,255,0.03);
  }

  h1{
    margin:0 0 10px 0;
    font-size:28px;
    letter-spacing:-0.4px;
  }

  p{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
  }

  .badge{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
    color:var(--accent);
    border: 1px solid rgba(126,231,193,0.12);
    display:inline-flex;
    gap:8px;
    align-items:center;
    margin-bottom:20px;
  }

  .construction {
    width:100px;
    height:100px;
    display:grid;
    place-items:center;
    margin:20px auto;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.03);
  }

  .gear{
    width:70px;
    height:70px;
    animation:spin 4s linear infinite;
    opacity:0.9;
  }

  @keyframes spin{from{transform:rotate(0deg)} to{transform:rotate(360deg)}}

  a{
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid rgba(126,231,193,0.3);
    transition:opacity 0.2s;
  }

  a:hover{opacity:0.7}

  footer{
    margin-top:28px;
    font-size:13px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="badge" aria-hidden="true">
      🛠️ Under Development
    </div>

    <div class="construction" role="img" aria-label="Animated gear indicating ongoing work">
      <svg class="gear" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#7ee7c1" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#7c3aed" stop-opacity="0.85"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round">
          <path d="M50 30 A20 20 0 1 1 49.99 30" stroke-linecap="round"/>
          <path d="M50 6v10M50 84v10M6 50h10M84 50h10M20 20l7 7M73 73l7 7M20 80l7-7M73 27l7-7" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <h1>Portfolio — Under Construction</h1>
    <p>
      I’m currently rebuilding this portfolio to feature improved projects, refined visuals, and a better experience.
      <br><br>
      You can visit the temporary version
      <a href="https://nitinmaurya.netlify.app/" target="_blank" rel="noopener">here</a>.
    </p>

    <footer>
      © 2025 Nitin Maurya. All rights reserved.
    </footer>
  </main>
</body>
</html>
