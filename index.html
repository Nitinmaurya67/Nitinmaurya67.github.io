<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio — Under Development</title>
<link rel="author" href="mailto:yourname@example.com" />
<style>
  :root{
    --bg1:#0f1724;
    --bg2:#071029;
    --card:#0b1220;
    --accent:#7ee7c1;
    --muted:#9aa6b2;
    --glass: rgba(255,255,255,0.04);
    --ok: #16a34a;
    --danger:#ef4444;
    --radius:16px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    background: radial-gradient(1200px 600px at 10% 10%, rgba(126,231,193,0.06), transparent 8%),
                radial-gradient(900px 500px at 90% 90%, rgba(124,58,237,0.05), transparent 8%),
                linear-gradient(180deg,var(--bg1),var(--bg2));
    color:#e6eef6;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:grid;
    place-items:center;
    padding:32px;
  }

  .card{
    width:100%;
    max-width:980px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    border-radius:var(--radius);
    box-shadow: 0 8px 30px rgba(2,6,23,0.6);
    padding:32px;
    display:grid;
    grid-template-columns: 1fr 380px;
    gap:28px;
    align-items:center;
    border: 1px solid rgba(255,255,255,0.03);
  }

  /* Responsive */
  @media (max-width:880px){
    .card{grid-template-columns:1fr; padding:22px}
  }

  .left{
    padding-right:8px;
  }

  h1{
    margin:0 0 8px 0;
    font-size:28px;
    letter-spacing:-0.4px;
    line-height:1.05;
  }
  p.lead{
    margin:0 0 20px 0;
    color:var(--muted);
    font-size:15px;
  }

  /* Visual illustration + progress */
  .visual{
    display:flex;
    gap:18px;
    align-items:center;
  }

  .badge{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
    color:var(--accent);
    border: 1px solid rgba(126,231,193,0.12);
    display:inline-flex;
    gap:8px;
    align-items:center;
  }

  .construction {
    width:160px;
    height:160px;
    display:grid;
    place-items:center;
    background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.02));
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.03);
    position:relative;
  }

  /* Animated gear using SVG rotation */
  .gear{
    width:84px;
    height:84px;
    transform-origin:center;
    animation:spin 4s linear infinite;
    opacity:0.95;
  }
  @keyframes spin{from{transform:rotate(0deg)} to{transform:rotate(360deg)}}

  /* Right column */
  .right{
    background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
    padding:18px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.02);
  }

  .progress-wrap{
    display:flex;
    gap:14px;
    align-items:center;
    margin-bottom:14px;
  }

  .progress-info{
    flex:1;
  }
  .progress-label{
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .progress-bar{
    height:10px;
    background:var(--glass);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar > i{
    display:block;
    height:100%;
    width:0%;
    background: linear-gradient(90deg, rgba(126,231,193,0.16), rgba(126,231,193,0.28));
    box-shadow: 0 3px 18px rgba(126,231,193,0.06);
    border-radius:inherit;
    transition: width 1.2s cubic-bezier(.2,.9,.3,1);
  }

  .meta{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
  }
  .meta .contact{
    color:var(--muted);
    font-size:13px;
  }

  /* subscribe form */
  form.subscribe{
    margin-top:16px;
    display:flex;
    gap:10px;
  }
  input[type="email"]{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.03);
    background:transparent;
    color:inherit;
    outline:none;
    font-size:14px;
  }
  button.cta{
    padding:10px 14px;
    border-radius:10px;
    border: none;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    color:#061517;
    font-weight:600;
    cursor:pointer;
  }
  button.cta[aria-disabled="true"]{opacity:0.6; cursor:not-allowed}

  .note{
    margin-top:12px;
    font-size:13px;
    color:var(--muted);
  }

  /* small social row */
  .socials{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .socials a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    text-decoration:none;
    font-size:13px;
  }
  .socials svg{width:18px; height:18px; display:block; opacity:0.92}

  /* footer */
  .foot{
    margin-top:18px;
    font-size:13px;
    color:var(--muted);
  }

  /* subtle glass highlight */
  .glass-highlight{
    position:absolute;
    inset:0;
    pointer-events:none;
    border-radius:12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 30%);
    mix-blend-mode:overlay;
  }

  /* small accessible focus */
  a:focus, button:focus, input:focus{outline: 3px solid rgba(126,231,193,0.12); outline-offset:3px}

  /* success toast */
  .toast{
    display:none;
    margin-top:12px;
    padding:10px 12px;
    border-radius:10px;
    background: rgba(22,163,74,0.12);
    color:var(--ok);
    font-weight:600;
    font-size:14px;
  }

  /* error */
  .error{
    color:var(--danger);
    font-size:13px;
    margin-top:8px;
  }
</style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="page-title">
    <section class="left" aria-hidden="false">
      <div class="visual" aria-hidden="true">
        <span class="badge" aria-hidden="true">
          <!-- tiny wrench icon -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M21 2l-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 9l7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Under development
        </span>

        <div class="construction" role="img" aria-label="Animated gear indicating work in progress">
          <!-- Gear SVG -->
          <svg class="gear" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#7ee7c1" stop-opacity="0.95"/>
                <stop offset="1" stop-color="#7c3aed" stop-opacity="0.85"/>
              </linearGradient>
            </defs>
            <g fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round">
              <path d="M50 30 A20 20 0 1 1 49.99 30" stroke-linecap="round"/>
              <path d="M50 6v10M50 84v10M6 50h10M84 50h10M20 20l7 7M73 73l7 7M20 80l7-7M73 27l7-7" stroke-linecap="round"/>
            </g>
          </svg>

          <div style="position:absolute; bottom:8px; left:10px; right:10px; text-align:center; font-size:12px; color:var(--muted)">
            Rebuilding — better, faster, cleaner
          </div>

          <div class="glass-highlight" aria-hidden="true"></div>
        </div>
      </div>

      <h1 id="page-title">Portfolio — Under Construction</h1>
      <p class="lead">I’m actively rebuilding this site to showcase clearer projects, better code, and real product thinking.</p>

     

     
    </section>

  
  </main>

<script>
  // ---- Configuration ----
  // Set starting percentage (0-100). Update this manually or hook to real API.
  const START_PERCENT = 32;    // change as needed
  const ETA_DATE = (function(){
    // If you want a concrete date, set here. Otherwise leave null to show 'TBD'.
    // Example: return 'Nov 22, 2025';
    return null;
  })();

  // ---- DOM refs ----
  const arc = document.getElementById('progress-arc');
  const percentText = document.getElementById('percent-text');
  const linear = document.getElementById('linear');
  const etaEl = document.getElementById('eta-date');
  const toast = document.getElementById('toast');
  const err = document.getElementById('err');
  const submitBtn = document.getElementById('submit');
  const emailInput = document.getElementById('email');
  const status = document.getElementById('status');

  // animate progress (visual only)
  function setProgress(p){
    p = Math.max(0, Math.min(100, Math.round(p)));
    // circular arc uses stroke-dasharray trick (percentage of 100)
    arc.setAttribute('stroke-dasharray', p + ' 100');
    percentText.textContent = p + '%';
    linear.style.width = p + '%';
    status.textContent = (p < 50) ? 'Rebuilding' : (p < 90 ? 'Polishing' : 'Near Launch');
  }

  // initial animation from 0 to START_PERCENT
  (function animateToStart(){
    let cur = 0;
    const target = Math.max(0, Math.min(100, START_PERCENT));
    const step = Math.max(1, Math.round(target / 40));
    const id = setInterval(()=>{
      cur += step;
      if(cur >= target){ cur = target; clearInterval(id) }
      setProgress(cur);
    }, 28);
  })();

  // ETA
  if(ETA_DATE) etaEl.textContent = ETA_DATE;
  else etaEl.textContent = 'TBD';

  // Subscribe form (front-end only)
  document.getElementById('subscribe').addEventListener('submit', function(ev){
    ev.preventDefault();
    err.textContent = '';
    const email = (emailInput.value || '').trim();
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      err.textContent = 'Enter a valid email address.';
      emailInput.focus();
      return;
    }
    // Simulate a network call result
    submitBtn.setAttribute('aria-disabled','true');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Adding...';
    setTimeout(()=>{
      submitBtn.removeAttribute('aria-disabled');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Notify me';
      toast.style.display = 'block';
      emailInput.value = '';
      setTimeout(()=> toast.style.display = 'none', 4500);
    }, 900);
  });

  // Accessibility: allow Enter on email to submit
  emailInput.addEventListener('keypress', function(e){
    if(e.key === 'Enter') {
      e.preventDefault();
      submitBtn.click();
    }
  });
</script>
</body>
</html>
